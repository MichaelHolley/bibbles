<!doctype html>
<html lang="en" data-theme="oat">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta
			name="description"
			content="A cozy pomodoro timer with a floating window that follows you across tabs."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..700&family=Figtree:wght@400..600&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				const stored = localStorage.getItem('bibbles:theme');
				const dark = matchMedia('(prefers-color-scheme: dark)').matches;
				const theme = stored ? JSON.parse(stored) : dark ? 'ember' : 'oat';
				if (theme === 'oat' || theme === 'ember') document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
